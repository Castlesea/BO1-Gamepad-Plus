; bo1pad - controller config for Call of Duty: Black Ops
; This file is re-read automatically a moment after you save it, even with the game open.

[General]
; mouse  = right stick drives the game's mouse look (no aim acceleration/lag, recommended)
; native = the game's own console-style gamepad aim (has aim assist, feels heavier)
AimMode=native
; writes bo1pad.log next to the game exe
Log=1
; 1 = D-pad works as the arrow keys (menus + item slots via the arrow binds). 0 = original D-pad keys.
DpadMenuArrows=1

[MouseAim]
; turn speed in degrees per second with the stick fully pushed (independent of mouse sensitivity)
YawSpeed=300
PitchSpeed=200
; radial deadzone of the right stick (0.0 - 1.0). Raise it if the view drifts.
Deadzone=0.08
; deflection treated as 100% (lower = reach full speed sooner)
OuterDeadzone=0.97
; response curve: 1.0 = linear, higher = finer control near the center
Curve=1.8
; extra speed multiplier while holding LT (the game already slows mouse aim when zoomed)
AdsMultiplier=1.0
AdsTriggerThreshold=0.3
; turn boost when the stick is held at the edge (for quick 180s). 1.0 disables it.
BoostMultiplier=1.6
BoostThreshold=0.95
BoostRampTime=0.25
; 1 = invert vertical look (the game's own "Invert Look" option is also respected)
InvertPitch=0

[LeftStick]
; radial deadzone for movement
Deadzone=0.10
; minimum output just past the deadzone (0.0 - 0.3), helps walking start instantly
AntiDeadzone=0.0

[Dvars]
; Written directly into the game every half second. Cheat-protected dvars work too.
; Delete a line to leave that dvar alone.
; console aim acceleration (the main cause of "laggy" native gamepad aim)
aim_accel_turnrate_enabled=0
; console response graph for the sticks
aim_input_graph_enabled=0
; the game's own stick deadzone (bo1pad already applies one above)
gpad_stick_deadzone_min=0.0
